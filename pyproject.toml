[project]
name = "prontian"
version = "0.8.0"
description = "Local sequencing run import, molecular review and traceable HTML/PDF reports"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "GPL-3.0-only"

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["pronto_report/static/igv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.coverage.run]
source = ["pronto_desktop", "pronto_ingest", "pronto_report", "pronto_web"]
omit = ["*/tests*", "*/test_*", "*/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
