name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'
          cache: pip
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Check dependency manifests and locks
        run: python scripts/check_dependencies.py
      - name: Install locked Python dependencies
        run: python -m pip install -r requirements-dev-lock.txt
      - name: Verify installed Python dependency graph
        run: python -m pip check
      - name: Install locked JavaScript tooling
        run: npm ci --ignore-scripts
      - name: Lint, formatting, code reference and diagrams
        run: python scripts/check_quality.py
      - name: Audit runtime dependencies
        run: python -m pip_audit -r requirements-lock.txt
      - name: Audit development dependencies
        run: python -m pip_audit -r requirements-dev-lock.txt
      - name: Audit JavaScript tooling
        run: npm audit --audit-level=moderate
      - name: Check Django model/migration consistency
        run: python manage.py makemigrations --check --dry-run --settings=pronto_web.test_settings

  tests:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'
          cache: pip
      - name: Install headless Qt libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libopengl0
      - name: Check dependency manifests and locks
        run: python scripts/check_dependencies.py
      - name: Install locked Python dependencies
        run: python -m pip install -r requirements-dev-lock.txt
      - name: Verify installed Python dependency graph
        run: python -m pip check
      - name: Unit, import and native GUI tests
        run: python -m coverage run -m pytest -q --ignore=pronto/tests/reporting/browser
      - name: Report application coverage
        run: python -m coverage report
      - name: Django request, persistence and access tests
        run: python manage.py test pronto_web.reports --settings=pronto_web.test_settings

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'
          cache: pip
      - name: Install Qt libraries required by the shared pytest plugins
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libopengl0
      - name: Check dependency manifests and locks
        run: python scripts/check_dependencies.py
      - name: Install locked Python dependencies
        run: python -m pip install -r requirements-dev-lock.txt
      - name: Verify installed Python dependency graph
        run: python -m pip check
      - name: Install the matching Chromium build
        run: python -m playwright install --with-deps chromium
      - name: Select installed Chromium
        run: |
          python -c "from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print('PRONTO_BROWSER_EXECUTABLE='+p.chromium.executable_path); p.stop()" >> "$GITHUB_ENV"
      - name: Test real Chromium workflows
        run: python -m pytest pronto/tests/reporting/browser -q
